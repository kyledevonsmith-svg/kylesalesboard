<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Compare</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="toprule"></div>
  <div class="page">
    <header class="home-head">
      <div class="fuels" id="fuels"></div>
      <h1>Select your State/Territory:</h1>
      <div class="states" id="states" role="group" aria-label="State or territory"></div>
      <p class="subtitle" id="subtitle"></p>
    </header>
    <div class="split">
      <aside class="customer" id="customer" aria-label="Customer"></aside>
      <div class="board" id="board"></div>
    </div>
    <p class="fine" id="fine"></p>
  </div>
  <div class="overlay" id="overlay" hidden></div>
  <script src="data.js"></script>
  <script src="calc.js"></script>
  <script src="compare.js"></script>
  <script src="app.js"></script>
</body>
</html>
